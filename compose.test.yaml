services:
  db-test:
    image: postgres:17
    restart: unless-stopped

    env_file:
      - ./apps/api/.env.test

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - orderflow_test_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  orderflow_test_data:
